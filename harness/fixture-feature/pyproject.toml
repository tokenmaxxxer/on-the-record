[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fixture-feature"
version = "0.1.0"
description = "Northpole E2E harness fixture — feature-add scenario (issue #895 type 2): greet command has no --format flag yet"
requires-python = ">=3.9"

[project.scripts]
fixture-feature = "fixture_feature:main"

[tool.setuptools]
packages = ["fixture_feature"]
